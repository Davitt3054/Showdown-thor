# Fabrica la app (.apk) en GitHub.
# - En cualquier rama: la fabrica y la deja en "Artifacts" para pruebas.
# - En la rama main y con la llave guardada: además la publica en Releases.
name: Fabricar APK

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      # (web/ sí fabrica app nueva: con el repositorio privado la app no puede descargar
      #  el estilo y el script, así que tienen que ir dentro del .apk)
  workflow_dispatch:     # botón "Run workflow" para fabricarla a mano

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la llave de firma
        id: llave
        env:
          THOR_KEYSTORE: ${{ secrets.THOR_KEYSTORE }}
        run: |
          if [ -n "$THOR_KEYSTORE" ]; then
            echo "$THOR_KEYSTORE" | base64 -d > "$RUNNER_TEMP/thor.jks"
            echo "THOR_KEYSTORE_FILE=$RUNNER_TEMP/thor.jks" >> "$GITHUB_ENV"
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No está guardada la llave THOR_KEYSTORE: el .apk sale con llave de pruebas y no se publica."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Fabricar
        env:
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p salida
          # Dos apps: cada una con su nombre fijo (así "releases/latest/download/..." baja siempre la última).
          cp app/build/outputs/apk/release/app-release.apk salida/Showdown-Thor.apk
          cp movil/build/outputs/apk/release/movil-release.apk salida/Showdown-Movil.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Showdown-0.3.${{ github.run_number }}
          path: salida/*.apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main' && steps.llave.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="0.3.${GITHUB_RUN_NUMBER}"
          gh release create "v$V" salida/*.apk \
            --title "Showdown $V" \
            --notes "Dos apps separadas: **Showdown-Thor.apk** para la Thor y **Showdown-Movil.apk** para el móvil. Cada una se instala encima de la suya anterior." \
            --latest
